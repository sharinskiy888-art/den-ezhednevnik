[pytest]
testpaths = tests
markers =
    etap2: вход, личные данные, права, копии (приёмка этапа 2)
    etap3: поручения, присутствие, файлы (приёмка этапа 3)
    etap4: CRM — клиенты, объекты, заявки, ТО, деньги (приёмка этапа 4)
    etap5: перенос из Supabase и сверка (приёмка этапа 5)
    etap6: запуск, копии и откат для установки (приёмка этапа 6)
    etap7: модуль АК-Сервера — подпись, роли, служебные адреса, пакет
